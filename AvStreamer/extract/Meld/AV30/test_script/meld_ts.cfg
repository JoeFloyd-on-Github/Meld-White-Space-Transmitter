#-------------------------------------------------------------------------------------------------------------
# Field: dvo_enable_packet_spacing (ViXS internal use, please keep every nibble 0x0)
#
# Bits 0 to 3 represents DVO-0, Bits 4 – 7 represents DVO-1.
#
# If the corresponding bit in dvo_update_data is '1' and it is under parallel mode
# 0x0 in a nibble (4-bit) position = no forced spacing on the corresponding parallel DVO output
# 0x1 in a nibble (4-bit) position = single inter-packet spacing on the corresponding parallel DVO output
# 0x2 in a nibble (4-bit) position = double inter-packet spacing on the corresponding parallel DVO output
#
# If the corresponding bit in dvo_update_data is '0', packet spacing configuration is unchanged for the 
# corresponding DVO port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------


dvo_enable_packet_spacing = 0x00


#-------------------------------------------------------------------------------------------------------------
# Field: dvo_serial_mode_sync_duration (ViXS internal use, please keep every nibble 0x0)
#
# Bits 0 to 3 represents DVO-0, Bits 4 – 7 represents DVO-1.
#
# If the corresponding bit in dvo_update_data is '1' and it is under serial mode
# 0x0 in a nibble (4-bit) position = sync signal is raised for 1 cycle on the corresponding serial DVO output
# 0x1 in a nibble (4-bit) position = sync signal is raised for 8 cycles on the corresponding serial DVO output
#
# If the corresponding bit in dvo_update_data is '0', sync duration configuration is unchanged for the 
# corresponding DVO port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#dvo_serial_mode_sync_duration = 0x00               #DVO-0 & DVO-1 1-cycle sync              (if dvo_update_data = 0x3)
#dvo_serial_mode_sync_duration = 0x11               #DVO-0 & DVO-1 8-cycle sync              (if dvo_update_data = 0x3)
#dvo_serial_mode_sync_duration = 0x10               #DVO-0 1-cycle sync; DVO-1 8-cycle sync  (if dvo_update_data = 0x3)
#dvo_serial_mode_sync_duration = 0x01               #DVO-0 8-cycle sync; DVO-1 1-cycle sync  (if dvo_update_data = 0x3)
#dvo_serial_mode_sync_duration = 0x00               #DVO-0 1-cycle sync; DVO-1 sync duration configuration unchanged (if dvo_update_data = 0x1)
#dvo_serial_mode_sync_duration = 0x01               #DVO-0 8-cycle sync; DVO-1 sycn duration configuration unchanged (if dvo_update_data = 0x1)


dvo_serial_mode_sync_duration = 0x00                #DVO-0 & DVO-1 1-cycle sync              (if dvo_update_data = 0x3)


#-------------------------------------------------------------------------------------------------------------
# Field: dvo_serial_mode_sync_duration (ViXS internal use, please keep every nibble 0x0)
#
# Bits 0 to 3 represents DVO-0, Bits 4 – 7 represents DVO-1.
#
# If the corresponding bit in dvo_update_data is '1' and it is under serial mode
# 0x0 in a nibble (4-bit) position = TS packet size is 188 bytes on the corresponding DVO output
# 0x1 in a nibble (4-bit) position = TS packet size is 192 bytes on the corresponding DVO output
#
# If the corresponding bit in dvo_update_data is '0', packet size configuration is unchanged for the 
# corresponding DVO port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
