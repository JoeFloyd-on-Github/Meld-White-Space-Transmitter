#----------------------
#TS input configuration
#----------------------

#-------------------------------------------------------------------------------------------------------------
# Field: device
# An Integer to mention the device to be configured
#-------------------------------------------------------------------------------------------------------------
# device = 0			# device = DEVICE_NAME
# device = 1			# device = DEVICE_NAME2
# device = 2			# device = DEVICE_NAME3
# device = 3			# device = DEVICE_NAME4

device = 0

#-------------------------------------------------------------------------------------------------------------
# Field: tsd_update_data
#
# A 6-bit field to control whether the setting of a paticular TSI port is reset, kept intact, or changed.
# Reset behavior is dependent on dvo_update_data field.
# +-----------------+-----------------+----------------------------------------------------------------------+
# | tsd_update_data | dvo_update_data | Effects on TSI configurations                                        |
# +-----------------+-----------------+----------------------------------------------------------------------+
# |        0        |        0        | RESET all TSI's and DVO's configurations to default (ViXS SDK board) |
# +-----------------+-----------------+----------------------------------------------------------------------+
# |        0        |    non-zero     | TSI's configurations are kept INTACT as previous ones                |
# +-----------------+-----------------+----------------------------------------------------------------------+
# | 0x00000001 to   |       any       | TSI's configurations are CHANGED accordingly. See explantaion below  |
# | 0x0000003F      |                 |                                                                      |
# +-----------------+-----------------+----------------------------------------------------------------------+
# |      other      |       any       | Only the lowest 6 bits are examined. All highest 26 bits should be   |
# |                 |                 | left as '0'                                                          |
# +-----------------+-----------------+----------------------------------------------------------------------+
# Any one of the TSI's can be independently set to be kept intact or be changed as specified by the 
# corresponding bit in tsd_update_data. Multiple TSI's can be configured in a single TSCONFIG invocation. 
# In case of resetting to default configurations, the reset is applied to ALL TSI's.
#
# When the value of tsd_update_data is from 0x00000001 to 0x0000003F,
# Bit position 0 represents TSI-0; Bit 1 represents TSI-1, ... etc. A value of binary '0' in a particular 
# bit position means the configuration of the corresponding TSI is not changed. A value of binary '1' in 
# a particular bit position means the configuration of the corresponding TSI will be changed according to 
# the values of { tsd_sync | tsd_enable | tsd_active_valid_high | tsd_negative_edge | 
# tsd_parallel_input_channel | tsd_packet_204_size | tsd_packet_192_size | tsd_keep_null_packet }.
#-------------------------------------------------------------------------------------------------------------
#tsd_update_data = 0x3F             #update configurations of TSI-0, TSI-1, TSI-2, TSI-3, TSI-4, TSI-5
#tsd_update_data = 0x03             #update configurations of TSI-0, TSI-1
#tsd_update_data = 0x15             #update configurations of TSI-0, TSI-2, TSI-4
#tsd_update_data = 0x2A             #update configurations of TSI-1, TSI-3, TSI-5


tsd_update_data = 0x3F             #update configurations of TSI-0, TSI-1, TSI-2, TSI-3, TSI-4, TSI-5


#-------------------------------------------------------------------------------------------------------------
# Field: tsd_*
#
# A 6-bit field to control a particular TSI port
# +-----------------+----------------------------------------------------------------------------------------+
# | tsd_*           | Effects on TSI configurations                                                          |
# +-----------------+----------------------------------------------------------------------------------------+
# | 0x00000000 to   | Bit position 0 represents TSI-0; Bit position 1 represents TSI-1;                      |
# | 0x0000003F      | Bit position 2 represents TSI-2; Bit position 3 represents TSI-3;                      |
# |                 | Bit position 4 represents TSI-4; Bit position 5 represents TSI-5.                      |
# |                 | Only if the corresponding bit in tsd_update_data is '1', the bit value will be read to |
# |                 | configure that particular TSI port.                                                    |
# |                 | Otherwise, if the corresponding bit in tsd_update_data is '0', the configuration of    |
# |                 | that TSI port is not changed at all. (except tsd_update_data = dvo_update_data = 0     | 
# |                 | which triggers a reset)                                                                |
# +-----------------+----------------------------------------------------------------------------------------+
# |      other      | Only the lowest 6 bits are examined. All highest 26 bits should be left as '0'         |
# +-----------------+----------------------------------------------------------------------------------------+
#-------------------------------------------------------------------------------------------------------------

#-------------------------------------------------------------------------------------------------------------
# Field: tsd_sync
#
# Each bit position represents a TS input on the hardware
#
# If the corresponding bit in tsd_update_data is '1'
# Binary '0' in a bit position = SYNC signal is ignored  for the corresponding TS input port
# Binary '1' in a bit position = SYNC signal is honoured for the corresponding TS input port
#
# If the corresponding bit in tsd_update_data is '0', SYNC signal configuration is unchanged for the 
# corresponding TS input port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#tsd_sync = 0x00                    #inputs 0,1,2,3,4,5 SYNC ignored                        (if tsd_update_data = 0x3F)
#tsd_sync = 0x3F                    #inputs 0,1,2,3,4,5 SYNC honoured                       (if tsd_update_data = 0x3F)
#tsd_sync = 0x2A                    #inputs 1,3,5 SYNC ignored;  inputs 1,3,5 SYNC honoured (if tsd_update_data = 0x3F)
#tsd_sync = 0x15                    #inputs 0,2,4 SYNC honoured; inputs 1,3,5 SYNC ignored  (if tsd_update_data = 0x3F)
#tsd_sync = 0x00                    #inputs 0,1 SYNC ignored;    inputs 2,3,4,5 SYNC configuration unchanged (if tsd_update_data = 0x03)
#tsd_sync = 0x03                    #inputs 0,1 SYNC honoured;   inputs 2,3,4,5 SYNC configuration unchanged (if tsd_update_data = 0x03)


tsd_sync = 0x00                    #inputs 0,1,2,3,4,5 SYNC ignored                         (if tsd_update_data = 0x3F)


#-------------------------------------------------------------------------------------------------------------
# Field: tsd_enable
#
# Each bit position represents a TS input on the hardware
#
# If the corresponding bit in tsd_update_data is '1'
# Binary '0' in a bit position = port is disabled for the corresponding TS input port
# Binary '1' in a bit position = port is enabled  for the corresponding TS input port
#
# If the corresponding bit in tsd_update_data is '0', enable/disable state is unchanged for the 
# corresponding TS input port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#tsd_enable = 0x00                  #inputs 0,1,2,3,4,5 disabled                  (if tsd_update_data = 0x3F)
#tsd_enable = 0x3F                  #inputs 0,1,2,3,4,5 enabled                   (if tsd_update_data = 0x3F)
#tsd_enable = 0x2A                  #inputs 1,3,5 disabled; inputs 1,3,5 enabled  (if tsd_update_data = 0x3F)
#tsd_enable = 0x15                  #inputs 0,2,4 enabled;  inputs 1,3,5 disabled (if tsd_update_data = 0x3F)
#tsd_enable = 0x00                  #inputs 0,1   disabled; inputs 2,3,4,5 enable/disable state unchanged (if tsd_update_data = 0x03)
#tsd_enable = 0x03                  #inputs 0,1   enabled;  inputs 2,3,4,5 enable/disable state unchanged (if tsd_update_data = 0x03)


tsd_enable = 0x3F                  #inputs 0,1,2,3,4,5 enabled                   (if tsd_update_data = 0x3F)


#-------------------------------------------------------------------------------------------------------------
# Field: tsd_active_valid_high
#
# Each bit position represents a TS input on the hardware
#
# If the corresponding bit in tsd_update_data is '1'
# Binary '0' in a bit position = VALID is considered as active when VALID is low  for the corresponding TS input port
# Binary '1' in a bit position = VALID is considered as active when VALID is high for the corresponding TS input port
#
# If the corresponding bit in tsd_update_data is '0', VALID configuration is unchanged for the 
# corresponding TS input port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#tsd_active_valid_high = 0x00       #inputs 0,1,2,3,4,5 active low                      (if tsd_update_data = 0x3F)
#tsd_active_valid_high = 0x3F       #inputs 0,1,2,3,4,5 active high                     (if tsd_update_data = 0x3F)
#tsd_active_valid_high = 0x2A       #inputs 1,3,5 active low;  inputs 1,3,5 actiev high (if tsd_update_data = 0x3F)
#tsd_active_valid_high = 0x15       #inputs 0,2,4 active high; inputs 1,3,5 actiev low  (if tsd_update_data = 0x3F)
#tsd_active_valid_high = 0x00       #inputs 0,1   active low;  inputs 2,3,4,5 VALID configuration unchanged (if tsd_update_data = 0x03)
#tsd_active_valid_high = 0x03       #inputs 0,1   active high; inputs 2,3,4,5 VALID configuration unchanged (if tsd_update_data = 0x03)


tsd_active_valid_high = 0x00       #inputs 0,1,2,3,4,5 active low                      (if tsd_update_data = 0x3F)


#-------------------------------------------------------------------------------------------------------------
# Field: tsd_negative_edge
#
# Each bit position represents a TS input on the hardware
#
# If the corresponding bit in tsd_update_data is '1'
# Binary '0' in a bit position = DATA bit is latched on the rising/positive edge of CLOCK for the corresponding TS input port
# Binary '1' in a bit position = DATA bit is latched on the falling/negative edge of CLOCK for the corresponding TS input port
#
# If the corresponding bit in tsd_update_data is '0', DATA latching configuration is unchanged for the 
# corresponding TS input port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#tsd_negative_edge = 0x00           #inputs 0,1,2,3,4,5 rising edge                       (if tsd_update_data = 0x3F)
#tsd_negative_edge = 0x3F           #inputs 0,1,2,3,4,5 falling edge                      (if tsd_update_data = 0x3F)
#tsd_negative_edge = 0x2A           #inputs 1,3,5 rising edge;  inputs 1,3,5 falling edge (if tsd_update_data = 0x3F)
#tsd_negative_edge = 0x15           #inputs 0,2,4 falling edge; inputs 1,3,5 rising edge  (if tsd_update_data = 0x3F)
#tsd_negative_edge = 0x00           #inputs 0,1   rising edge;  inputs 2,3,4,5 DATA latching configuration unchanged (if tsd_update_data = 0x03)
#tsd_negative_edge = 0x03           #inputs 0,1   falling edge; inputs 2,3,4,5 DATA latching configuration unchanged (if tsd_update_data = 0x03)


tsd_negative_edge = 0x3F           #inputs 0,1,2,3,4,5 falling edge                      (if tsd_update_data = 0x3F)


#-------------------------------------------------------------------------------------------------------------
# Field: tsd_parallel_input_channel
#
# Each bit position represents a TS input on the hardware
#
# If the corresponding bit in tsd_update_data is '1'
# Binary '0' in a bit position = port is in serial mode   for the corresponding TS input port
# Binary '1' in a bit position = port is in parallel mode for the corresponding TS input port
#
# If the corresponding bit in tsd_update_data is '0', parallel/serial mode configuration is unchanged for the 
# corresponding TS input port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#
# Bit value only has effect on input 0 since inputs 1,2,3,4,5 are always serial
#-------------------------------------------------------------------------------------------------------------
#tsd_parallel_input_channel= 0x00   #inputs 0,1,2,3,4,5 serial                                                 (if tsd_update_data = 0x3F)
#tsd_parallel_input_channel= 0x01   #input 0 parallel (through cable card input pins); inputs 1,2,3,4,5 serial (if tsd_update_data = 0x3F)


tsd_parallel_input_channel = 0x00  #inputs 0,1,2,3,4,5 serial                                                 (if tsd_update_data = 0x3F)


#-------------------------------------------------------------------------------------------------------------
# Field: tsd_packet_204_size
#
# Each bit position represents a TS input on the hardware
#
# If the corresponding bit in tsd_update_data is '1'
# Binary '0' in a bit position = packet size is 188 for the corresponding TS input port
# Binary '1' in a bit position = packet size is 204 for the corresponding TS input port
#
# If the corresponding bit in tsd_update_data is '0', packet size configuration is unchanged for the 
# corresponding TS input port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#tsd_packet_204_size = 0x00           #inputs 0,1,2,3,4,5 packet size are 188                             (if tsd_update_data = 0x3F)
#tsd_packet_204_size = 0x3F           #inputs 0,1,2,3,4,5 packet size are 204                             (if tsd_update_data = 0x3F)
#tsd_packet_204_size = 0x2A           #inputs 1,3,5 packet size are 188; inputs 1,3,5 packet size are 204 (if tsd_update_data = 0x3F)
#tsd_packet_204_size = 0x15           #inputs 0,2,4 packet size are 204; inputs 1,3,5 packet size are 188 (if tsd_update_data = 0x3F)
#tsd_packet_204_size = 0x00           #inputs 0,1   packet size are 188; inputs 2,3,4,5 packet size configuration unchanged (if tsd_update_data = 0x03)
#tsd_packet_204_size = 0x03           #inputs 0,1   packet size are 204; inputs 2,3,4,5 packet size configuration unchanged (if tsd_update_data = 0x03)


tsd_packet_204_size = 0x00           #inputs 0,1,2,3,4,5 packet size are 188                             (if tsd_update_data = 0x3F)


#-------------------------------------------------------------------------------------------------------------
# Field: tsd_packet_192_size
#
# Each bit position represents a TS input on the hardware
#
# If the corresponding bit in tsd_update_data is '1'
# Binary '0' in a bit position = packet size is 188 for the corresponding TS input port
# Binary '1' in a bit position = packet size is 192 for the corresponding TS input port
#
# If the corresponding bit in tsd_update_data is '0', packet size configuration is unchanged for the 
# corresponding TS input port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#tsd_packet_192_size = 0x00           #inputs 0,1,2,3,4,5 packet size are 188                             (if tsd_update_data = 0x3F)
#tsd_packet_192_size = 0x3F           #inputs 0,1,2,3,4,5 packet size are 192                             (if tsd_update_data = 0x3F)
#tsd_packet_192_size = 0x2A           #inputs 1,3,5 packet size are 188; inputs 1,3,5 packet size are 192 (if tsd_update_data = 0x3F)
#tsd_packet_192_size = 0x15           #inputs 0,2,4 packet size are 192; inputs 1,3,5 packet size are 188 (if tsd_update_data = 0x3F)
#tsd_packet_192_size = 0x00           #inputs 0,1   packet size are 188; inputs 2,3,4,5 packet size configuration unchanged (if tsd_update_data = 0x03)
#tsd_packet_192_size = 0x03           #inputs 0,1   packet size are 192; inputs 2,3,4,5 packet size configuration unchanged (if tsd_update_data = 0x03)


tsd_packet_192_size = 0x00           #inputs 0,1,2,3,4,5 packet size are 188                             (if tsd_update_data = 0x3F)


#-------------------------------------------------------------------------------------------------------------
# Field: tsd_keep_null_packet (ViXS internal use, please keep every bit '0')
#
# Each bit position represents a TS input on the hardware
#
# If the corresponding bit in tsd_update_data is '1'
# Binary '0' in a bit position = Xcode internally drops null packets from the corresponding TS input port
# Binary '1' in a bit position = Xcode internally keeps null packets from the corresponding TS input port
#
# If the corresponding bit in tsd_update_data is '0', null packet configuration is unchanged for the 
# corresponding TS input port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------


tsd_keep_null_packet = 0x00


#-----------------------------
#TS output (DVO) configuration
#-----------------------------

#-------------------------------------------------------------------------------------------------------------
# Field: dvo_update_data
#
# A 2-bit field to control whether the setting of a paticular DVO port is reset, kept intact, or changed.
# Reset behavior is dependent on tsd_update_data field.
# +-----------------+-----------------+----------------------------------------------------------------------+
# | tsd_update_data | dvo_update_data | Effects on TSI configurations                                        |
# +-----------------+-----------------+----------------------------------------------------------------------+
# |        0        |        0        | RESET all TSI's and DVO's configurations to default (ViXS SDK board) |
# +-----------------+-----------------+----------------------------------------------------------------------+
# |    non-zero     |        0        | Both DVO's configurations are kept INTACT as previous ones           |
# +-----------------+-----------------+----------------------------------------------------------------------+
# |       any       |   0x00000001    | DVO-0's configurations are CHANGED accordingly. DVO-1's              |
# |                 |                 | configurations are kept INTACT. See explantaion below                |
# +-----------------+-----------------+----------------------------------------------------------------------+
# |       any       |   0x00000002    | DVO-1's configurations are CHANGED accordingly. DVO-0's              |
# |                 |                 | configurations are kept INTACT. See explantaion below                |
# +-----------------+-----------------+----------------------------------------------------------------------+
# |       any       |   0x00000003    | Both DVO's configurations are CHANGED accordingly. see explanation   |
# |                 |                 | below                                                                |
# +-----------------+-----------------+----------------------------------------------------------------------+
# |       any       |      other      | Only the lowest 2 bits are examined. All highest 30 bits should be   |
# |                 |                 | left as '0'                                                          |
# +-----------------+-----------------+----------------------------------------------------------------------+
# Any one of the DVO's can be independently set to be kept intact or be changed as specified by the 
# corresponding bit in dvo_update_data. Multiple DVO's can be configured in a single TSCONFIG invocation. 
# In case of resetting to default configurations, the reset is applied to ALL DVO's.
#
# When the value of dvo_update_data is from 0x00000001 to 0x00000003,
# Bit position 0 represents DVO-0; Bit 1 represents DVO-1. A value of binary '0' in a particular 
# bit position means the configuration of the corresponding DVO is not changed. A value of binary '1' in 
# a particular bit position means the configuration of the corresponding DVO will be changed according to 
# the values of { dvo_data_mode | dvo_clock_invert | dvo_increment_disable | dvo_valid_high | dvo_clock_select 
# | dvo_null_packet| dvo_enable_packet_spacing | dvo_serial_mode_sync_duration | dvo_packet_192_size}.
#-------------------------------------------------------------------------------------------------------------
#dvo_update_data = 0x1                #update configurations of DVO-0
#dvo_update_data = 0x2                #update configurations of DVO-1
#dvo_update_data = 0x3                #update configurations of DVO-0 and DVO-1


dvo_update_data = 0x3                 #update to DVO-0 and DVO-1 only               ### pja


#-------------------------------------------------------------------------------------------------------------
# Field: dvo_*
#
# A 8-bit (2-nibbles) field to control a particular DVO port
# +-----------------+----------------------------------------------------------------------------------------+
# | dvo_*           | Effects on DVO configurations                                                          |
# +-----------------+----------------------------------------------------------------------------------------+
# | 0x000000XY      | Bits 0 to 3 (nibble Y) represents DVO-0; Bits 4 – 7 (nibble X) represents DVO-1.       |
# +-----------------+----------------------------------------------------------------------------------------+
# |      other      | Only the lowest 8 bits are examined. All highest 24 bits should be left as '0'         |
# +-----------------+----------------------------------------------------------------------------------------+
#-------------------------------------------------------------------------------------------------------------

#-------------------------------------------------------------------------------------------------------------
# Field: dvo_data_mode
#
# Bits 0 to 3 represents DVO-0, Bits 4 – 7 represents DVO-1.
#
# If the corresponding bit in dvo_update_data is '1'
# 0x0 in a nibble (4-bit) position = port is in serial mode   for the corresponding DVO output
# 0x1 in a nibble (4-bit) position = port is in parallel mode for the corresponding DVO outputt
#
# If the corresponding bit in tsd_update_data is '0', parallel/serial mode configuration is unchanged for the 
# corresponding DVO port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#
# Bit value only has effect on DVO-0 since DVO-1 is always serial
#-------------------------------------------------------------------------------------------------------------
#dvo_data_mode = 0x00                 #DVO-0 & DVO-1 serial                                          (if dvo_update_data = 0x3)
#dvo_data_mode = 0x01                 #DVO-0 parallel (through cable card output pins); DVO-1 serial (if dvo_update_data = 0x3)


dvo_data_mode = 0x00                  #DVO-0 & DVO-1 serial                                          (if dvo_update_data = 0x3)


#-------------------------------------------------------------------------------------------------------------
# Field: dvo_clock_invert
#
# Bits 0 to 3 represents DVO-0, Bits 4 – 7 represents DVO-1.
#
# If the corresponding bit in dvo_update_data is '1'
# 0x0 in a nibble (4-bit) position = DATA bit is clocked out on positive/rising/normal edge
#                                for the corresponding DVO output
# 0x1 in a nibble (4-bit) position = DATA bit is clocked out on negative/falling/inverted edge
#                                for the corresponding DVO output
#
# If the corresponding bit in dvo_update_data is '0', DATA clocking configuration is unchanged for the 
# corresponding DVO port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#dvo_clock_invert = 0x00              #DVO-0 & DVO-1 rising edge              (if dvo_update_data = 0x3)
#dvo_clock_invert = 0x11              #DVO-0 & DVO-1 falling edg              (if dvo_update_data = 0x3)
#dvo_clock_invert = 0x10              #DVO-0 rising edge;  DVO-1 falling edge (if dvo_update_data = 0x3)
#dvo_clock_invert = 0x01              #DVO-0 falling edge; DVO-1 rising edge  (if dvo_update_data = 0x3)
#dvo_clock_invert = 0x00              #DVO-0 rising edge;  DVO-1 DATA clocking configuration unchanged (if dvo_update_data = 0x1)
#dvo_clock_invert = 0x01              #DVO-0 falling edge; DVO-1 DATA clocking configuration unchanged (if dvo_update_data = 0x1)


dvo_clock_invert = 0x00               #DVO-0 rising edge;                     (if dvo_update_data = 0x3) ### pja


#-------------------------------------------------------------------------------------------------------------
# Field: dvo_increment_disable (ViXS internal use, please keep every nibble 0x0)
#
# Bits 0 to 3 represents DVO-0, Bits 4 – 7 represents DVO-1.
#
# If the corresponding bit in dvo_update_data is '1'
# 0x0 in a nibble (4-bit) position = PCR incrementer enabled for the corresponding DVO output
# 0x1 in a nibble (4-bit) position = PCR incrementer disabled for the corresponding DVO output
#
# If the corresponding bit in dvo_update_data is '0', PCR incrementer configuration is unchanged for the 
# corresponding DVO port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------


dvo_increment_disable = 0x00


#-------------------------------------------------------------------------------------------------------------
# Field: dvo_valid_high
#
# Bits 0 to 3 represents DVO-0, Bits 4 – 7 represents DVO-1.
#
# If the corresponding bit in dvo_update_data is '1'
# 0x0 in a nibble (4-bit) position = VALID is low when it is active on the corresponding DVO output
# 0x1 in a nibble (4-bit) position = VALID is high when it is active on the corresponding DVO output
#
# If the corresponding bit in dvo_update_data is '0', VALID configuration is unchanged for the 
# corresponding DVO port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#dvo_valid_high = 0x00                #DVO-0 & DVO-1 VALID low            (if dvo_update_data = 0x3)
#dvo_valid_high = 0x11                #DVO-0 & DVO-1 VALID high           (if dvo_update_data = 0x3)
#dvo_valid_high = 0x10                #DVO-0 VALID low;  DVO-1 VALID high (if dvo_update_data = 0x3)
#dvo_valid_high = 0x01                #DVO-0 VALID high; DVO-1 VALID low  (if dvo_update_data = 0x3)
#dvo_valid_high = 0x00                #DVO-0 VALID low;  DVO-1 VALID configuration unchanged (if dvo_update_data = 0x1)
#dvo_valid_high = 0x01                #DVO-0 VALID high; DVO-1 VALID configuration unchanged (if dvo_update_data = 0x1)


dvo_valid_high = 0x11                #DVO-0 & DVO-1 VALID high            (if dvo_update_data = 0x3)  ### PJA


#-------------------------------------------------------------------------------------------------------------
# Field: dvo_clock_select
#
# Bits 0 to 3 represents DVO-0, Bits 4 – 7 represents DVO-1.
#
# If the corresponding bit in dvo_update_data is '1'
# 0x0 in a nibble (4-bit) position = clock at 13.5 MHz on the corresponding DVO output
# 0x1 in a nibble (4-bit) position = clock at 27 MHz on the corresponding DVO output
# 0x2 in a nibble (4-bit) position = clock at 54 MHz on the corresponding DVO output
# 0x3 in a nibble (4-bit) position = clock at 108 MHz on the corresponding DVO output
#
# If the corresponding bit in dvo_update_data is '0', CLOCK frequency configuration is unchanged for the 
# corresponding DVO port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#dvo_clock_select = 0x11                #DVO-0 & DVO-1 27Mhz      (if dvo_update_data = 0x3)
#dvo_clock_select = 0x22                #DVO-0 & DVO-1 54MHz      (if dvo_update_data = 0x3)
#dvo_clock_select = 0x21                #DVO-0 27Mhz; DVO-1 54MHz (if dvo_update_data = 0x3)
#dvo_clock_select = 0x12                #DVO-0 54MHz; DVO-1 27MHz (if dvo_update_data = 0x3)
#dvo_clock_select = 0x01                #DVO-0 27MHz; DVO-1 VALID configuration unchanged (if dvo_update_data = 0x1)
#dvo_clock_select = 0x02                #DVO-0 54MHz; DVO-1 VALID configuration unchanged (if dvo_update_data = 0x1)


dvo_clock_select = 0x11                #DVO-0 & DVO-1 27Mhz      (if dvo_update_data = 0x3)


#-------------------------------------------------------------------------------------------------------------
# Field: dvo_null_packet
#
# Bits 0 to 3 represents DVO-0, Bits 4 – 7 represents DVO-1.
#
# If the corresponding bit in dvo_update_data is '1'
# 0x0 in a nibble (4-bit) position = no null stuffing on the corresponding DVO output
# 0x1 in a nibble (4-bit) position = do null stuffing on the corresponding DVO output
#
# If the corresponding bit in dvo_update_data is '0', null stuffing configuration is unchanged for the 
# corresponding DVO port (except tsd_update_data = dvo_update_data = 0 which triggers a reset)
#-------------------------------------------------------------------------------------------------------------
#dvo_null_packet = 0x00               #DVO-0 & DVO-1 no null-stuffing                     (if dvo_update_data = 0x3)
#dvo_null_packet = 0x11               #DVO-0 & DVO-1 do null-stuffing                     (if dvo_update_data = 0x3)
#dvo_null_packet = 0x10               #DVO-0 no null-stuffing;   DVO-1 does null-stuffing (if dvo_update_data = 0x3)
